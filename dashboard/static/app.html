<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Dashboard</title>
  <script>
    (function() {

        // Global uncaught error suppressor for external injected scripts trying to write to fetch

          }
        };
        _win.addEventListener('error', _suppressFetchErr, true);

        var _prevOnError = _win.onerror;
        _win.onerror = function(msg, url, line, col, err) {

          }

          return fn.apply(window, arguments);
        };

                }
              }
            });

        }
      } catch (_) {}
    })();
  </script>
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:           #020617;
      --bg-deep:      #01040f;
      --surface:      rgba(0, 102, 255, 0.06);
      --surface-card: rgba(2, 12, 34, 0.75);
      --border:       rgba(0, 180, 255, 0.18);
      --border-glow:  rgba(0, 210, 255, 0.45);
      --accent:       #00d2ff;
      --accent-deep:  #0066ff;
      --accent-glow:  rgba(0, 210, 255, 0.35);
      --adim:         rgba(0, 102, 255, 0.14);
      --text:         #e0f2fe;
      --muted:        #64748b;
      --green:        #00f0ff;
      --gdim:         rgba(0, 240, 255, 0.14);
    }
    html, body {
      height: 100%;
      background: radial-gradient(circle at 50% 25%, #051433 0%, #020617 70%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.94);
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 80, 255, 0.12);
      z-index: 10;
    }
    .logo { font-size: 15px; font-weight: 800; letter-spacing: 6px; text-shadow: 0 0 16px rgba(0, 210, 255, 0.4); }
    .logo em { color: var(--accent); font-style: normal; text-shadow: 0 0 20px #00d2ff; }
    .pill {
      display: flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 99px; background: var(--surface); border: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: #7dd3fc; transition: all 0.3s;
    }
    .pill.on { background: var(--gdim); border-color: rgba(0, 240, 255, 0.4); color: var(--green); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); transition: background 0.3s; }
    .pill.on .dot { background: var(--green); box-shadow: 0 0 8px #00f0ff; animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .spacer { flex: 1; }
    .enc-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1.5px; padding: 3px 8px;
      border-radius: 4px; display: none;
    }
    .enc-badge.on  { display: block; background: rgba(0,210,255,0.12); border: 1px solid rgba(0,210,255,0.3); color: #38bdf8; }
    .enc-badge.off { display: block; background: rgba(255,100,100,0.08); border: 1px solid rgba(255,100,100,0.2); color: #f87171; }

    /* ── 12-HOUR HUD CLOCK THEME ── */
    .hud-clock {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      background: rgba(0, 30, 80, 0.25);
      border: 1px solid rgba(0, 210, 255, 0.35);
      border-radius: 9px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', monospace;
      box-shadow: 0 0 14px rgba(0, 102, 255, 0.2);
      user-select: none;
      flex-shrink: 0;
    }
    .hud-clock-icon {
      font-size: 11px;
      color: var(--accent);
      opacity: 0.9;
    }
    .hud-clock-time {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #e0e7ff;
    }
    .hud-clock-ampm {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      background: rgba(0, 102, 255, 0.25);
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(0, 210, 255, 0.35);
    }
    .btn-voice {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: #7dd3fc;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-voice:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 10px rgba(0,210,255,0.25); }
    .btn-voice.active {
      color: #38bdf8;
      border-color: rgba(0, 210, 255, 0.45);
      background: rgba(0, 102, 255, 0.18);
      box-shadow: 0 0 10px rgba(0, 102, 255, 0.25);
    }
    .url { font-size: 10px; font-family: monospace; color: var(--muted); padding: 4px 9px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }

    /* ── 3D HOLOGRAPHIC CORE ORB STAGE ── */
    .orb-stage {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, rgba(0, 70, 210, 0.16) 0%, rgba(2, 6, 23, 0.98) 75%);
      border-bottom: 1px solid rgba(0, 180, 255, 0.22);
      overflow: hidden;
      transition: height 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: grab;
      user-select: none;
      z-index: 5;
    }
    .orb-stage:active { cursor: grabbing; }
    .orb-stage.compact { height: 110px; }
    .orb-stage.cinematic { height: 320px; }
    #orb-canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 32px rgba(0, 140, 255, 0.45));
    }
    .orb-backdrop-glow {
      position: absolute;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 160, 255, 0.28) 0%, rgba(0, 60, 220, 0.12) 55%, transparent 75%);
      pointer-events: none;
      filter: blur(24px);
      animation: core-breathe 3.6s ease-in-out infinite;
    }
    @keyframes core-breathe {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    .orb-telemetry {
      position: absolute;
      bottom: 8px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
      gap: 10px;
    }
    .orb-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #7dd3fc;
      backdrop-filter: blur(8px);
      font-family: 'SF Mono', Monaco, monospace;
    }
    .orb-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00d2ff;
      box-shadow: 0 0 8px #00d2ff;
      animation: pulse-dot 1.2s infinite;
    }
    @keyframes pulse-dot { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.4);opacity:0.6} }
    .orb-sync-meter {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 3px 10px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      font-family: 'SF Mono', Monaco, monospace;
    }
    .sync-lbl {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--muted);
    }
    .sync-bar-track {
      width: 54px;
      height: 4px;
      background: rgba(0, 102, 255, 0.25);
      border-radius: 2px;
      overflow: hidden;
    }
    .sync-bar {
      height: 100%;
      width: 6%;
      background: linear-gradient(90deg, #0066ff, #00e5ff);
      border-radius: 2px;
      transition: width 0.08s ease-out;
      box-shadow: 0 0 8px #00d2ff;
    }
    .sync-pct {
      font-size: 9px;
      font-weight: 700;
      color: #38bdf8;
      width: 28px;
      text-align: right;
    }
    .orb-mode-btn {
      pointer-events: auto;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(0, 210, 255, 0.32);
      color: #7dd3fc;
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .orb-mode-btn:hover {
      background: rgba(0, 102, 255, 0.35);
      border-color: #00d2ff;
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
    }

    @media (max-width: 680px) {
      .url { display: none; }
      .hud-clock { padding: 4px 8px; gap: 4px; }
      .hud-clock-time { font-size: 11px; letter-spacing: 1px; }
      .btn-voice span { display: none; }
      .orb-stage { height: 165px; }
      .orb-stage.compact { height: 95px; }
      .orb-stage.cinematic { height: 250px; }
    }

    /* ── FEED ── */
    main { flex: 1; overflow-y: auto; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-thumb { background: rgba(0, 180, 255, 0.2); border-radius: 4px; }
    main::-webkit-scrollbar-thumb:hover { background: rgba(0, 210, 255, 0.4); }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; animation: pop 0.18s ease; }
    @keyframes pop { from { opacity:0; transform:translateY(4px); } }
    .msg-j   { align-self:flex-start; background:rgba(0, 85, 255, 0.13); border:1px solid rgba(0, 210, 255, 0.24); border-bottom-left-radius:4px; box-shadow: 0 0 16px rgba(0, 102, 255, 0.1); }
    .msg-u   { align-self:flex-end;   background:rgba(0, 30, 80, 0.25); border:1px solid rgba(0, 180, 255, 0.18); border-bottom-right-radius:4px; }
    .msg-sys { align-self:center; font-size:11px; color:#7dd3fc; padding:2px 0; background:transparent; border:none; letter-spacing:0.3px; opacity: 0.85; }
    .lbl {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 4px;
    }
    .msg-j .lbl { color:var(--accent); text-shadow: 0 0 8px rgba(0, 210, 255, 0.3); }
    .msg-u .lbl { color:#94a3b8; }
    .msg-time {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.75;
      text-transform: uppercase;
    }
    .sys-time {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
      font-size: 10px;
      opacity: 0.6;
      margin-right: 4px;
    }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: rgba(0, 30, 80, 0.25); border: 1px solid rgba(0, 180, 255, 0.22);
      border-radius: 14px; border-bottom-right-radius: 4px;
      padding: 11px 14px; display: flex; align-items: center; gap: 12px;
      max-width: 82%; animation: pop 0.18s ease;
      box-shadow: 0 0 16px rgba(0, 102, 255, 0.1);
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  { font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; opacity:0.6; color:#7dd3fc; margin-bottom:4px; }
    .fc-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #e0f2fe; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .fc-bar-wrap { height: 3px; background: rgba(0, 102, 255, 0.2); border-radius: 2px; margin-top: 7px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #0066ff, #00d2ff); border-radius: 2px; transition: width 0.12s linear; }
    .fc-status { font-size: 10px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err  { color: #f87171; }
    .fc-dl { display:block; margin-top:6px; font-size:11px; color:var(--accent); text-decoration:none; font-weight:600; }
    .fc-dl:hover { opacity: 0.8; text-shadow: 0 0 8px #00d2ff; }

    /* ── FOOTER ── */
    footer {
      flex-shrink:0; padding:10px 14px; border-top:1px solid var(--border);
      background: rgba(2, 6, 23, 0.95); display:flex; gap:8px; align-items:center;
      box-shadow: 0 -4px 20px rgba(0, 80, 255, 0.1);
      z-index: 10;
    }
    #inp {
      flex:1; padding:11px 14px; background: rgba(0, 25, 60, 0.35);
      border: 1.5px solid rgba(0, 180, 255, 0.22); border-radius:12px;
      color:var(--text); font-size:14px; outline:none; transition:border-color 0.15s, box-shadow 0.15s;
    }
    #inp:focus { border-color: var(--accent); box-shadow: 0 0 16px rgba(0, 210, 255, 0.25); }
    #inp::placeholder { color: var(--muted); }
    .btn { padding:11px 15px; border:none; border-radius:12px; font-size:11px; font-weight:700; letter-spacing:1.5px; cursor:pointer; transition:opacity 0.15s,transform 0.1s, box-shadow 0.2s; }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { opacity: 0.88; }
    .btn-send { background: linear-gradient(135deg, #0066ff, #00d2ff); color: #fff; box-shadow: 0 0 16px rgba(0, 140, 255, 0.35); }
    .btn-send:hover { box-shadow: 0 0 24px rgba(0, 210, 255, 0.5); }
    .btn-wake { background:var(--surface); border:1px solid var(--border); color:var(--muted); display:none; }
    .btn-wake.show { display:block; color:var(--green); border-color:rgba(0,240,255,0.4); }
    .btn-attach {
      background: var(--surface); border: 1px solid var(--border); color: #7dd3fc;
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-attach:hover  { opacity: 0.88; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px rgba(0,210,255,0.25); }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface); border: 1px solid var(--border); color: #7dd3fc;
      padding: 11px 13px; font-size: 16px; line-height: 1; border-radius: 12px;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #mic-btn:hover  { opacity: 0.88; border-color: var(--accent); color: var(--accent); box-shadow: 0 0 12px rgba(0,210,255,0.25); }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(0, 210, 255, 0.2); border-color: #00d2ff; color: #00d2ff;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.6);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.65;transform:scale(0.97)} }

    /* ── DELAY BADGE ── */
    .delay-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 9px;
      border-radius: 8px;
      background: rgba(0, 102, 255, 0.14);
      border: 1px solid rgba(0, 210, 255, 0.32);
      font-size: 11px;
      font-weight: 700;
      color: #7dd3fc;
      white-space: nowrap;
      user-select: none;
      font-family: 'SF Mono', Monaco, monospace;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .delay-badge span { color: var(--accent); }

    /* ── TOAST ── */
    #toast {
      position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
      background: rgba(0, 30, 80, 0.85); border:1px solid rgba(0, 210, 255, 0.45);
      color: #7dd3fc; font-size:12px; font-weight:700; letter-spacing:1px;
      padding:7px 18px; border-radius:99px;
      box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
      backdrop-filter: blur(10px);
      opacity:0; transition:opacity 0.22s,transform 0.22s;
      pointer-events:none; white-space:nowrap; z-index: 99;
    }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── MARK LIII HUD CONTROLS THEME (AS PER USER UPLOADED SCREENSHOT) ── */
    .btn-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 9px;
      border: 1px solid rgba(0, 210, 255, 0.35);
      background: rgba(0, 30, 50, 0.4);
      color: #00f0d0;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-controls:hover {
      border-color: #00f0d0;
      box-shadow: 0 0 12px rgba(0, 240, 208, 0.3);
      background: rgba(0, 50, 70, 0.6);
    }
    .btn-controls.active {
      border-color: #00f0d0;
      color: #00f0d0;
      background: rgba(0, 240, 208, 0.12);
      box-shadow: 0 0 12px rgba(0, 240, 208, 0.25);
    }

    .workspace-layout {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .workspace-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    /* ── CONTROLS SIDEBAR PANEL (1:1 CLONE OF SCREENSHOT) ── */
    .controls-panel {
      width: 284px;
      flex-shrink: 0;
      background: #01151c;
      border-left: 1px solid #004d5a;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), margin-right 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
      z-index: 25;
      position: relative;
      box-shadow: -8px 0 25px rgba(0, 20, 35, 0.45);
      user-select: none;
    }
    .controls-panel.collapsed {
      margin-right: -284px;
      pointer-events: none;
      opacity: 0;
    }

    /* Decorative edge tabs matching left edge of screenshot */
    .controls-edge-tab {
      position: absolute;
      top: 14px;
      left: -14px;
      width: 14px;
      height: 46px;
      background: #01151c;
      border: 1px solid #004d5a;
      border-right: none;
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: -4px 0 10px rgba(0, 240, 208, 0.15);
      transition: background 0.15s, border-color 0.15s;
      z-index: 26;
    }
    .controls-edge-tab:hover {
      background: #002633;
      border-color: #00f0d0;
    }
    .tab-pip {
      width: 3px;
      height: 5px;
      background: #00f0d0;
      border-radius: 1px;
      box-shadow: 0 0 4px #00f0d0;
    }

    .controls-header {
      padding: 12px 14px 10px 14px;
      border-bottom: 1px solid rgba(0, 240, 210, 0.22);
      display: flex;

  <script>
    // ── 12-Hour Clock & Theme Helpers ─────────────────────────────────────────
    function format12Hour(date = new Date(), withSeconds = false) {
      const d = date instanceof Date ? date : new Date(date);
      let hours = d.getHours();
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const seconds = String(d.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      return withSeconds
        ? { digits: `${hours}:${minutes}:${seconds}`, ampm, full: `${hours}:${minutes}:${seconds} ${ampm}` }
        : { digits: `${hours}:${minutes}`, ampm, full: `${hours}:${minutes} ${ampm}` };
    }

    function updateHudClock() {
      const { digits, ampm } = format12Hour(new Date(), true);
      const digitsEl = document.getElementById('clock-digits');
      const ampmEl = document.getElementById('clock-ampm');
      if (digitsEl) digitsEl.textContent = digits;
      if (ampmEl) ampmEl.textContent = ampm;
    }
    setInterval(updateHudClock, 1000);
    updateHudClock();

    // ── Speech Synthesis (Voice) ──────────────────────────────────────────────
    let _voiceActive = true;
    function toggleVoice() {
      _voiceActive = !_voiceActive;
      const btn = document.getElementById('voice-btn');
      if (btn) {
        if (_voiceActive) {
          btn.className = 'btn-voice active';
          btn.innerHTML = '🔊 <span>VOICE</span>';
          toast('Voice enabled');
        } else {
          btn.className = 'btn-voice';
          btn.innerHTML = '🔇 <span>MUTED</span>';
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
          toast('Voice muted');
        }
      }
    }

    let _isJarvisSpeaking = false;

    function speakJarvis(text) {
      if (!_voiceActive || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const clean = text.replace(/[*_#`~]/g, '').replace(/https?:\/\/\S+/g, '');
        const u = new SpeechSynthesisUtterance(clean);
        u.rate = 1.0;
        u.pitch = 0.95;
        const voices = window.speechSynthesis.getVoices();
        const preferred = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Daniel') || v.name.includes('David') || v.name.includes('Male')));
        if (preferred) u.voice = preferred;

        u.onstart = () => {
          _isJarvisSpeaking = true;
          if (typeof setOrbState === 'function') setOrbState('JARVIS VOCALIZING');
        };
        u.onend = () => {
          _isJarvisSpeaking = false;
          if (typeof setOrbState === 'function') setOrbState(_isListening ? 'LISTENING TO VOICE' : 'HOLO CORE ONLINE');
        };
        u.onerror = () => {
          _isJarvisSpeaking = false;
          if (typeof setOrbState === 'function') setOrbState('HOLO CORE ONLINE');
        };

        window.speechSynthesis.speak(u);
      } catch (_) {}
    }

    // Pre-load voices
    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── MARK LIII HUD CONTROLS SYSTEM (1:1 IMPLEMENTATION OF USER DESIGN) ─────
    let _controlsOpen = true;
    try {
      const stored = localStorage.getItem('jarvis_controls_open');
      if (stored !== null) _controlsOpen = stored === 'true';
    } catch (_) {}

    function updateControlsPanelUI() {
      const panel = document.getElementById('controls-panel');
      const btn = document.getElementById('controls-toggle-btn');
      if (panel) {
        if (_controlsOpen) {
          panel.classList.remove('collapsed');
        } else {
          panel.classList.add('collapsed');
        }
      }
      if (btn) {
        btn.classList.toggle('active', _controlsOpen);
      }
    }

    function toggleControlsMenu(forceOpen) {
      if (typeof forceOpen === 'boolean') {
        _controlsOpen = forceOpen;
      } else {
        _controlsOpen = !_controlsOpen;
      }
      try { localStorage.setItem('jarvis_controls_open', String(_controlsOpen)); } catch (_) {}
      updateControlsPanelUI();
      if (_controlsOpen) toast('Mark LIII Controls: Online');
    }
    setTimeout(updateControlsPanelUI, 50);

    // ── Fullscreen Action ──
    function toggleFullscreenAction() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        toast('FULLSCREEN MODE [F11]');
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        toast('EXIT FULLSCREEN');
      }
    }
    document.addEventListener('fullscreenchange', () => {
      const lbl = document.getElementById('lbl-fullscreen');
      const isFs = Boolean(document.fullscreenElement);
      if (lbl) lbl.textContent = isFs ? 'EXIT FULLSCREEN  [F11]' : 'FULLSCREEN  [F11]';
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreenAction();
      }
    });

    // ── Create Desktop Shortcut Action ──
    let _deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _deferredInstallPrompt = e;
    });

    function createDesktopShortcut() {
      if (_deferredInstallPrompt) {
        _deferredInstallPrompt.prompt();
        _deferredInstallPrompt.userChoice.then((res) => {
          if (res.outcome === 'accepted') {
            toast('JARVIS App Installed to Desktop');
          }
          _deferredInstallPrompt = null;
        });
        return;
      }

    // ── Audio sci-fi chime helper ──
    function playCyberChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const o1 = ctx.createOscillator();
        const o2 = ctx.createOscillator();
        const g = ctx.createGain();
        o1.type = 'sine';
        o1.frequency.setValueAtTime(587.33, now);
        o1.frequency.exponentialRampToValueAtTime(880, now + 0.15);
        o2.type = 'triangle';
        o2.frequency.setValueAtTime(880, now);
        o2.frequency.exponentialRampToValueAtTime(1174.66, now + 0.18);
        g.gain.setValueAtTime(0.2, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        o1.connect(g);
        o2.connect(g);
        g.connect(ctx.destination);
        o1.start(now);
        o2.start(now);
        o1.stop(now + 0.45);
        o2.stop(now + 0.45);
      } catch (_) {}
    }

    // ── Cyberpunk Procedural QR Code Canvas ──
    function drawCyberQR(canvas, text) {
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      ctx.fillStyle = '#01161e';
      ctx.fillRect(0, 0, w, h);
      const grid = 21;
      const cellSize = w / grid;
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = ((hash << 5) - hash) + text.charCodeAt(i) | 0;

      function isFinder(r, c) {
        return (r < 7 && c < 7) || (r < 7 && c >= grid - 7) || (r >= grid - 7 && c < 7);
      }

      function drawFinder(r0, c0) {
        ctx.fillStyle = '#00f0d0';
        ctx.fillRect(c0 * cellSize, r0 * cellSize, 7 * cellSize, 7 * cellSize);
        ctx.fillStyle = '#01161e';
        ctx.fillRect((c0 + 1) * cellSize, (r0 + 1) * cellSize, 5 * cellSize, 5 * cellSize);
        ctx.fillStyle = '#00f0d0';
        ctx.fillRect((c0 + 2) * cellSize, (r0 + 2) * cellSize, 3 * cellSize, 3 * cellSize);
      }

      drawFinder(0, 0);
      drawFinder(0, grid - 7);
      drawFinder(grid - 7, 0);

      for (let r = 0; r < grid; r++) {
        for (let c = 0; c < grid; c++) {
          if (isFinder(r, c)) continue;
          if (r === 6 || c === 6) {
            if ((r + c) % 2 === 0) {
              ctx.fillStyle = '#00f0d0';
              ctx.fillRect(c * cellSize + 1, r * cellSize + 1, cellSize - 2, cellSize - 2);
            }
            continue;
          }
          const bit = Math.abs(Math.sin((r * 31 + c * 17 + hash)) * 10000) % 1 > 0.48;
          if (bit) {
            ctx.fillStyle = (r + c) % 3 === 0 ? '#38bdf8' : '#00f0d0';
            ctx.fillRect(c * cellSize + 1, r * cellSize + 1, cellSize - 2, cellSize - 2);
          }
        }
      }
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }

      const greeting = h24 < 12 ? 'Good morning' : h24 < 18 ? 'Good afternoon' : 'Good evening';
      const timeStr = format12Hour(now, false).full;
      const launchText = `${greeting}, Sir. The time is currently ${timeStr}. All JARVIS core subsystems are operational and online.`;
      append('jarvis', launchText, Date.now());
      speakJarvis(launchText);
    }

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => {

    ws.onmessage = (e) => {

      if (m.type === 'log') {

          const isFresh = !m.timestamp || (Date.now() - m.timestamp < 7000);
          if (isFresh) speakJarvis(m.text);
        }
      }
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          { sys('Wake word detected — connecting…', m.timestamp); announceLaunchTime(); }
      if (m.type === 'sys')           sys(m.text, m.timestamp);
      if (m.type === 'file_received') _onFileReceived(m);

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      // Create file card in feed
      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'Sent';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ Download back</a>`);
          toast('File sent!');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = '#f87171';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    // ── Real-time Voice Command Engine (0.9s Silence Auto-Dispatch Delay) ────
    const micBtn = document.getElementById('mic-btn');
    let _speechRec = null;
    let _speechPauseTimer = null;
    let _isListening = false;
    const SPEECH_DELAY_MS = 900; // Calibrated strictly to 0.9 seconds

    function _micIdle() {
      if (micBtn) {
        micBtn.innerHTML = '🎤';
        micBtn.title = 'Voice command — auto-dispatches after 0.9s speech pause';
        micBtn.classList.remove('recording');
      }
      _isListening = false;
    }

    function doMic() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      // Also ensure AudioContext is primed for live voice visualization
      _initVoiceSyncAudio();

      // If already listening, stop immediately and submit whatever was spoken
      if (_isListening) {
        _stopSpeech(true);
        return;
      }

      if (!SpeechRecognition) {
        toast('Speech recognition not supported in this browser');
        return;
      }

      try {
        _speechRec = new SpeechRecognition();
        _speechRec.continuous = true;
        _speechRec.interimResults = true;
        _speechRec.lang = 'en-US';

        const inp = document.getElementById('inp');
        _isListening = true;
        setOrbState('LISTENING TO VOICE');
        micBtn.classList.add('recording');
        micBtn.innerHTML = '⏹';
        micBtn.title = 'Listening… Tap to finish immediately';
        toast('🎤 Listening — pauses auto-send in 0.9s');

        _speechRec.onresult = (event) => {
          let fullText = '';
          for (let i = 0; i < event.results.length; i++) {
            fullText += event.results[i][0].transcript;
          }
          const clean = fullText.trim();
          if (clean && inp) {
            inp.value = clean;
          }

          // Reset the 0.9 second pause timer whenever words are detected
          clearTimeout(_speechPauseTimer);
          _speechPauseTimer = setTimeout(() => {
            // Exactly 0.9s of silence/pause detected -> execute command!
            _stopSpeech(true);
          }, SPEECH_DELAY_MS);
        };

        _speechRec.onerror = (e) => {
          console.warn('[Speech Recognition]:', e.error);
          if (e.error === 'not-allowed') {
            sys('Microphone permission denied. Please allow mic access.');
            toast('Mic permission required');
          } else if (e.error !== 'no-speech') {
            toast('Voice: ' + e.error);
          }
          _stopSpeech(false);
        };

        _speechRec.onend = () => {
          if (_isListening) {
            _stopSpeech(false);
          }
        };

        _speechRec.start();
      } catch (err) {
        console.error('[Voice start error]:', err);
        toast('Microphone error');
        _stopSpeech(false);
      }
    }

    function _stopSpeech(send = true) {
      clearTimeout(_speechPauseTimer);
      _isListening = false;
      setOrbState('HOLO CORE ONLINE');
      if (_speechRec) {
        try {
          _speechRec.onend = null;
          _speechRec.stop();
        } catch (_) {}
        _speechRec = null;
      }
      _micIdle();

      if (send) {
        const inp = document.getElementById('inp');
        if (inp && inp.value.trim()) {
          toast('Dispatching command (0.9s delay)');
          doSend();
        }
      }
    }

    // ── 3D HOLOGRAPHIC JARVIS CORE & VOICE SYNC BEAT ENGINE ──────────────────
    let _audioCtx = null;
    let _audioAnalyser = null;
    let _audioDataArray = null;
    let _micMediaStream = null;
    let _liveVoiceLevel = 0.0;
    let _smoothVoiceLevel = 0.0;

    function setOrbState(txt) {
      const el = document.getElementById('core-state-txt');
      if (el) el.textContent = txt;
    }

    let _stageModes = ['', 'cinematic', 'compact'];
    let _stageModeIdx = 0;
    function toggleOrbView() {
      const stage = document.getElementById('orb-stage');
      if (!stage) return;
      _stageModeIdx = (_stageModeIdx + 1) % _stageModes.length;
      stage.classList.remove('cinematic', 'compact');

        stage.classList.add(_stageModes[_stageModeIdx]);
      }
      setTimeout(_handleOrbResize, 360);

    async function _initVoiceSyncAudio() {
      if (_audioAnalyser) return true;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return false;
        if (!_audioCtx) _audioCtx = new AudioContextClass();
        if (_audioCtx.state === 'suspended') {
          await _audioCtx.resume();
        }
        if (!_micMediaStream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          _micMediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        }
        if (_micMediaStream) {
          const source = _audioCtx.createMediaStreamSource(_micMediaStream);
          _audioAnalyser = _audioCtx.createAnalyser();
          _audioAnalyser.fftSize = 256;
          _audioAnalyser.smoothingTimeConstant = 0.8;
          source.connect(_audioAnalyser);
          _audioDataArray = new Uint8Array(_audioAnalyser.frequencyBinCount);
          return true;
        }
      } catch (err) {
        console.warn('[VoiceSyncAudio]:', err);
      }
      return false;
    }

    // Initialize 3D Orb Visualizer Canvas
    let _handleOrbResize = () => {};
    (function init3DVisualizer() {
      const canvas = document.getElementById('orb-canvas');
      const stage = document.getElementById('orb-stage');
      const syncBar = document.getElementById('sync-bar');
      const syncVal = document.getElementById('sync-val');
      if (!canvas || !stage) return;

      const ctx = canvas.getContext('2d');
      let w = 0, h = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      _handleOrbResize = () => {
        w = stage.clientWidth;
        h = stage.clientHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      };
      _handleOrbResize();
      window.addEventListener('resize', _handleOrbResize);

      // Priming audio on stage click
      stage.addEventListener('click', () => {
        _initVoiceSyncAudio();
      });

      // 3D Particles Generation
      // 1. Fibonacci Sphere Surface Nodes
      const SPHERE_COUNT = 950;
      const spherePts = [];
      for (let i = 0; i < SPHERE_COUNT; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / SPHERE_COUNT);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        spherePts.push({
          x0: Math.sin(phi) * Math.cos(theta),
          y0: Math.sin(phi) * Math.sin(theta),
          z0: Math.cos(phi),
          phi,
          theta,
          jitter: (Math.random() - 0.5) * 0.08,
          sz: 0.9 + Math.random() * 1.5,
          bright: 0.35 + Math.random() * 0.65
        });
      }

      // 2. Undulating Sinusoidal Ribbon Particles (matching the twisting cyan ribbons in the image)
      const RIBBON_COUNT = 1500;
      const ribbonPts = [];
      const numRibbons = 4;
      for (let r = 0; r < numRibbons; r++) {
        const countPerRibbon = Math.floor(RIBBON_COUNT / numRibbons);
        const inclination = (r * Math.PI) / numRibbons + 0.2;
        for (let i = 0; i < countPerRibbon; i++) {
          const u = (i / countPerRibbon) * Math.PI * 2;
          ribbonPts.push({
            ribbonId: r,
            u,
            inclination,
            widthSpread: (Math.random() - 0.5) * 0.24,
            freq: 3 + (r % 2),
            sz: 1.1 + Math.random() * 2.0,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      // 3. Drifting Ambient Holographic Sparks
      const SPARK_COUNT = 120;
      const sparks = [];
      for (let i = 0; i < SPARK_COUNT; i++) {
        sparks.push({
          r: 1.08 + Math.random() * 0.45,
          theta: Math.random() * Math.PI * 2,
          phi: Math.random() * Math.PI,
          speedTheta: (Math.random() - 0.5) * 0.012,
          speedPhi: (Math.random() - 0.5) * 0.008,
          sz: 0.7 + Math.random() * 1.4,
          life: Math.random()
        });
      }

      // Interactive 3D Orbit Dragging
      let isDragging = false;
      let lastMouseX = 0;
      let lastMouseY = 0;
      let rotX = 0.25;
      let rotY = 0.0;
      let velRotX = 0;
      let velRotY = 0.009;

      stage.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });
      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastMouseX;
        const dy = e.clientY - lastMouseY;
        velRotY = dx * 0.005;
        velRotX = dy * 0.005;
        rotY += velRotY;
        rotX += velRotX;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });
      window.addEventListener('mouseup', () => { isDragging = false; });

      stage.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          lastMouseX = e.touches[0].clientX;
          lastMouseY = e.touches[0].clientY;
          _initVoiceSyncAudio();
        }
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - lastMouseX;
        const dy = e.touches[0].clientY - lastMouseY;
        velRotY = dx * 0.005;
        velRotX = dy * 0.005;
        rotY += velRotY;
        rotX += velRotX;
        lastMouseX = e.touches[0].clientX;
        lastMouseY = e.touches[0].clientY;
      }, { passive: true });
      window.addEventListener('touchend', () => { isDragging = false; });

      // Render Loop with Voice Sync & Rhythmic Beating
      let startTime = performance.now();

      function render() {
        requestAnimationFrame(render);
        const now = performance.now();
        const t = (now - startTime) * 0.001;

        // Rotation inertia & auto orbit
        if (!isDragging) {
          velRotY *= 0.95;
          velRotX *= 0.95;
          rotY += 0.008 + velRotY;
          rotX += velRotX;
        }

        // 1. Audio Voice Energy Analysis
        _liveVoiceLevel = 0.0;
        if (_audioAnalyser && _audioDataArray) {
          _audioAnalyser.getByteFrequencyData(_audioDataArray);
          let sum = 0;
          const count = Math.min(_audioDataArray.length, 64);
          for (let i = 0; i < count; i++) {
            sum += _audioDataArray[i];
          }
          const avg = sum / count;
          _liveVoiceLevel = Math.min(1.0, Math.max(0.0, (avg - 14) / 95));
        }

        // If Jarvis is speaking synthesized voice, modulate smoothly
        if (_isJarvisSpeaking) {
          const jarvisMod = 0.45 + 0.38 * Math.abs(Math.sin(t * 14)) * Math.sin(t * 22) + 0.15 * Math.sin(t * 8);
          _liveVoiceLevel = Math.max(_liveVoiceLevel, Math.min(1.0, jarvisMod));
        }

        // Smooth Voice Follower
        _smoothVoiceLevel += (_liveVoiceLevel - _smoothVoiceLevel) * 0.22;

        // 2. Rhythmic Heartbeat Beating ("adn it should beate")
        // Double-thump organic cardiac cycle: lub (ventricular) + dub (arterial)
        const beatCycle = (t * 2.3) % (Math.PI * 2);
        const lub = Math.pow(Math.max(0, Math.sin(beatCycle)), 22) * 0.20;
        const dub = Math.pow(Math.max(0, Math.sin(beatCycle - 0.42)), 22) * 0.12;
        const heartBeatPulse = lub + dub;

        // Combined dynamic beat factor
        const dynamicBeat = heartBeatPulse * (1 - Math.min(1, _smoothVoiceLevel * 1.3)) + _smoothVoiceLevel * 0.95;

        // Update Voice Sync HUD Meter
        if (syncBar && syncVal) {
          const pct = Math.min(100, Math.round(dynamicBeat * 100));
          syncBar.style.width = pct + '%';
          syncVal.textContent = pct + '%';
        }

        // Clear Canvas
        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, w, h);

        const cx = w * 0.5;
        const cy = h * 0.5;
        const baseRadius = Math.min(w, h) * 0.32;
        const currentR = baseRadius * (1.0 + dynamicBeat * 0.36);
        const FOV = 420;

        // Rotation math precalculations
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);

        // Core Ambient Inner Halo
        const glowGrad = ctx.createRadialGradient(cx, cy, currentR * 0.1, cx, cy, currentR * 1.35);
        glowGrad.addColorStop(0, `rgba(0, 225, 255, ${0.35 + dynamicBeat * 0.35})`);
        glowGrad.addColorStop(0.35, `rgba(0, 110, 255, ${0.18 + dynamicBeat * 0.2})`);
        glowGrad.addColorStop(0.8, `rgba(0, 50, 180, ${0.05 + dynamicBeat * 0.08})`);
        glowGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, currentR * 1.35, 0, Math.PI * 2);
        ctx.fill();

        // Array of projected points to sort for 3D depth
        const drawQueue = [];

        // 1. Project Fibonacci Sphere Points
        for (let i = 0; i < spherePts.length; i++) {
          const p = spherePts[i];
          // Pulsing displacement on surface
          const disp = 1.0 + p.jitter + Math.sin(t * 3 + p.phi * 4) * (0.02 + dynamicBeat * 0.08);
          let x = p.x0 * currentR * disp;
          let y = p.y0 * currentR * disp;
          let z = p.z0 * currentR * disp;

          // Rotate around Y
          let x1 = x * cosY - z * sinY;
          let z1 = x * sinY + z * cosY;
          // Rotate around X
          let y2 = y * cosX - z1 * sinX;
          let z2 = y * sinX + z1 * cosX;

          const depth = FOV + z2;
          if (depth > 1) {
            const scale = FOV / depth;
            const px = cx + x1 * scale;
            const py = cy + y2 * scale;
            const alpha = Math.max(0.12, Math.min(1.0, (z2 / currentR + 1.2) * 0.45));
            drawQueue.push({
              type: 'sphere',
              x: px,
              y: py,
              z: z2,
              sz: p.sz * scale * (1 + dynamicBeat * 0.5),
              alpha,
              bright: p.bright
            });
          }
        }

        // 2. Project Undulating Sinusoidal Ribbon Points
        for (let i = 0; i < ribbonPts.length; i++) {
          const rp = ribbonPts[i];
          const angle = rp.u + t * 0.5 * (rp.ribbonId % 2 === 0 ? 1 : -1);
          // Wave height along ribbon
          const wave = Math.sin(angle * rp.freq + t * 4) * (0.18 + dynamicBeat * 0.32);
          const rad = currentR * (1.02 + wave + rp.widthSpread);

          // Position in ribbon plane
          let rx = Math.cos(angle) * rad;
          let ry = Math.sin(angle) * rad * 0.42;
          let rz = Math.sin(angle) * rad * 0.88;

          // Ribbon inclination tilt
          const cosI = Math.cos(rp.inclination), sinI = Math.sin(rp.inclination);
          let ry1 = ry * cosI - rz * sinI;
          let rz1 = ry * sinI + rz * cosI;

          // Global 3D rotation
          let x1 = rx * cosY - rz1 * sinY;
          let z1 = rx * sinY + rz1 * cosY;
          let y2 = ry1 * cosX - z1 * sinX;
          let z2 = ry1 * sinX + z1 * cosX;

          const depth = FOV + z2;
          if (depth > 1) {
            const scale = FOV / depth;
            const px = cx + x1 * scale;
            const py = cy + y2 * scale;
            const alpha = Math.max(0.15, Math.min(1.0, (z2 / currentR + 1.3) * 0.55));
            drawQueue.push({
              type: 'ribbon',
              x: px,
              y: py,
              z: z2,
              sz: rp.sz * scale * (1 + dynamicBeat * 0.7),
              alpha,
              ribbonId: rp.ribbonId
            });
          }
        }

        // 3. Ambient Drifting Sparks
        for (let i = 0; i < sparks.length; i++) {
          const sp = sparks[i];
          sp.theta += sp.speedTheta;
          sp.phi += sp.speedPhi;
          const rad = currentR * sp.r * (1 + dynamicBeat * 0.2);
          let sx = rad * Math.sin(sp.phi) * Math.cos(sp.theta);
          let sy = rad * Math.sin(sp.phi) * Math.sin(sp.theta);
          let sz = rad * Math.cos(sp.phi);

          let x1 = sx * cosY - sz * sinY;
          let z1 = sx * sinY + sz * cosY;
          let y2 = sy * cosX - z1 * sinX;
          let z2 = sy * sinX + z1 * cosX;

          const depth = FOV + z2;
          if (depth > 1) {
            const scale = FOV / depth;
            drawQueue.push({
              type: 'spark',
              x: cx + x1 * scale,
              y: cy + y2 * scale,
              z: z2,
              sz: sp.sz * scale * 1.2,
              alpha: Math.max(0.1, (z2 / currentR + 1.2) * 0.4)
            });
          }
        }

        // Depth sorting (back-to-front rendering)
        drawQueue.sort((a, b) => a.z - b.z);

        // Render Points
        for (let i = 0; i < drawQueue.length; i++) {
          const pt = drawQueue[i];
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, Math.max(0.6, pt.sz), 0, Math.PI * 2);

          if (pt.type === 'ribbon') {
            // Electric neon cyan ribbon with glowing white-hot peaks
            if (dynamicBeat > 0.35 && pt.alpha > 0.6) {
              ctx.fillStyle = `rgba(224, 242, 254, ${pt.alpha * 0.95})`;
            } else {
              ctx.fillStyle = `rgba(0, 220, 255, ${pt.alpha * 0.85})`;
            }
          } else if (pt.type === 'spark') {
            ctx.fillStyle = `rgba(56, 189, 248, ${pt.alpha * 0.9})`;
          } else {
            // Fibonacci sphere surface
            if (pt.bright > 0.8 && dynamicBeat > 0.2) {
              ctx.fillStyle = `rgba(0, 240, 255, ${pt.alpha * 0.85})`;
            } else {
              ctx.fillStyle = `rgba(0, 140, 255, ${pt.alpha * 0.65})`;
            }
          }
          ctx.fill();
        }

        ctx.restore();
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
